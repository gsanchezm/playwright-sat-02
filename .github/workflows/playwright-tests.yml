# ============================================================================
# Playwright Tests — workflow de GitHub Actions
# ============================================================================
# Este archivo le dice a GitHub: "cuando pase tal evento, prende una o varias
# máquinas virtuales limpias (llamadas 'runners') y ejecuta estos pasos en
# orden, de arriba hacia abajo". Es un archivo YAML: la indentación (los
# espacios, nunca tabs) es lo que define qué línea pertenece a qué bloque,
# parecido a cómo {} agrupa código en otros lenguajes.

# Nombre que va a aparecer en la pestaña "Actions" del repositorio en GitHub.
name: Playwright Tests

# "on" define QUÉ EVENTO dispara este workflow automáticamente.
on:
  # Se dispara cuando alguien hace "git push"...
  push:
    # ...pero solo si el push fue directo a la rama main o master.
    branches: [ main, master ]
  # También se dispara cuando se abre o se actualiza un Pull Request...
  pull_request:
    # ...que tenga como destino (base) la rama main o master.
    branches: [ main, master ]

# "jobs" es el conjunto de trabajos a ejecutar. Por defecto GitHub corre
# todos los jobs en paralelo, cada uno en su propia máquina virtual desde
# cero. Antes había un solo job "test" con los 5 proyectos en su matrix, así
# que los 5 corrían a la vez y el resumen del run se veía como una lista
# plana ("test (chromium)", "test (api)", ...), sin conexión entre ellos.
#
# Acá abajo lo partimos en DOS jobs, "api" y "ui", y "ui" declara
# "needs: api" para forzar el orden: primero corre "api" y, solo si pasa,
# arrancan las 4 repeticiones de "ui". Esa dependencia entre jobs es lo que
# hace que GitHub dibuje un grafo en el resumen del run (cajas conectadas
# con líneas, "api" ramificándose hacia las 4 de "ui") en vez de la lista
# plana de antes — es la forma nativa que tiene GitHub Actions de mostrar
# un pipeline con etapas; no es idéntica a la vista de Jenkins, pero es el
# equivalente que trae GitHub sin plugins extra.
jobs:
  # "api" corre tests/api/** contra el backend directamente. No abre
  # ningún navegador: usa el request context de Playwright (HTTP puro), no
  # un browser real. Por eso NO tiene el paso "Install Playwright
  # Browsers" — en playwright.config.ts el proyecto "api" no declara
  # "dependencies: ['setup']" ni "use: { ...devices[...] }" como sí hacen
  # chromium/ui-chromium/firefox/webkit, así que no hace falta descargar
  # Chromium/Firefox/WebKit solo para este job.
  api:
    name: API tests

    # Tiempo máximo (en minutos) que puede correr este job antes de que
    # GitHub lo mate a la fuerza. Protege contra un test colgado que se
    # quede corriendo para siempre y gaste minutos gratis del plan.
    timeout-minutes: 60

    # Sobre qué máquina virtual corre el job. "ubuntu-latest" es una
    # imagen de Linux limpia que GitHub ofrece gratis para repos públicos.
    runs-on: ubuntu-latest

    # Variables de entorno visibles para TODOS los pasos ("steps") de este
    # job, como si las hubieras hecho "export" antes de cada comando.
    env:
      # ubuntu-latest no tiene pantalla ni servidor gráfico (X server).
      # En playwright.config.ts, "headless" solo se activa cuando esta
      # variable vale exactamente el texto "true"; si no la definimos,
      # Playwright intenta abrir una ventana real de navegador y falla
      # de inmediato porque no hay dónde mostrarla. El proyecto "api" no
      # abre navegador, pero dejamos la variable por consistencia con el
      # job "ui" de abajo.
      HEADLESS: 'true'

    # "steps" es la lista ordenada de comandos/acciones que se ejecutan
    # uno tras otro, de arriba hacia abajo, dentro de la máquina virtual.
    steps:
      # Descarga (clona) el código de este repositorio dentro de la
      # máquina virtual. Sin este paso la máquina estaría vacía: no
      # habría package.json, ni tests, ni nada que ejecutar.
      - uses: actions/checkout@v4

      # Instala el gestor de paquetes pnpm en la máquina virtual. Este
      # proyecto usa pnpm (no npm) según se ve en package.json y en el
      # archivo pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
        with:
          # Fija la versión mayor de pnpm a usar, para que la instalación
          # sea consistente y no cambie sola de un día para otro.
          version: 11

      # Instala Node.js (el motor que ejecuta JavaScript/TypeScript) en
      # la máquina virtual.
      - uses: actions/setup-node@v4
        with:
          # "lts/*" = instala la última versión LTS (soporte a largo
          # plazo, la más estable) de Node.js disponible.
          node-version: lts/*
          # Le pide a esta acción que guarde en caché lo que pnpm
          # descargue, para que las próximas corridas del workflow
          # instalen las dependencias más rápido.
          cache: 'pnpm'

      # Descarga las dependencias del proyecto (las que están listadas
      # en package.json, como @playwright/test) usando pnpm.
      - name: Install dependencies
        # "--frozen-lockfile" hace que este paso FALLE si pnpm-lock.yaml
        # no coincide exactamente con package.json, en vez de generar un
        # lockfile distinto en silencio. Así garantizamos que en CI se
        # instalen las mismísimas versiones que usas en tu computadora.
        run: pnpm install --frozen-lockfile

      # Corre solo el proyecto "api" (tests/api/**).
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=api

      # Sube el reporte HTML de resultados como un "artifact": un archivo
      # descargable desde la página de este run en GitHub Actions.
      - uses: actions/upload-artifact@v4
        # Súbelo siempre, incluso si los tests fallaron — "!cancelled()"
        # solo evita subirlo si el job fue cancelado a la fuerza (por
        # ejemplo, manualmente o por timeout).
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 30

  # "ui" agrupa los 4 proyectos que sí abren navegador.
  #
  # Costo de este orden: antes "api" y las 4 de UI corrían en paralelo, así
  # que el run completo duraba lo que tardara el MÁS LENTO de los 5 (en la
  # práctica, "webkit", ~2m35s). Ahora "ui" espera a que "api" termine, así
  # que el run completo dura api + el más lento de ui — más que antes. Es
  # el costo de tener un orden real (y un grafo prolijo en el resumen) en
  # vez de todo corriendo a la vez.
  ui:
    name: UI tests

    # "needs: <job>" es la keyword de GitHub Actions que crea una
    # DEPENDENCIA entre jobs (antes de este cambio, ningún job del
    # workflow la usaba). Trae tres efectos, no uno solo:
    #   1. Orden: GitHub no arranca ninguna repetición de "ui" hasta que
    #      "api" termine OK. Es lo que pediste ("primero api, luego UI").
    #   2. Visualización: es justamente esta dependencia la que hace que
    #      GitHub dibuje un grafo en el resumen del run — cajas conectadas
    #      con líneas ("api" ramificándose hacia las 4 de "ui") — en vez
    #      de la lista plana sin conexión que se ve cuando todos los jobs
    #      son independientes.
    #   3. Si "api" FALLA, las 4 repeticiones de "ui" quedan "skipped" (ni
    #      siquiera llegan a correr) — no vas a tener resultados de
    #      chromium/firefox/webkit ese run. "fail-fast: false" de la
    #      matrix de abajo NO evita esto: esa opción solo controla qué
    #      pasa ENTRE repeticiones de la MISMA matrix (que "webkit" no
    #      cancele a "chromium"), no la relación entre los jobs "api" y
    #      "ui".
    needs: api

    # "strategy.matrix" hace que este job se repita una vez por cada valor
    # de la lista de abajo, cada repetición en su propia máquina virtual y
    # en paralelo entre sí (pero las 4 arrancan recién cuando "api" pasa).
    strategy:
      # Por defecto, si UNA repetición de la matrix falla, GitHub cancela
      # las demás que todavía estén corriendo. fail-fast: false apaga ese
      # comportamiento: así, si por ejemplo "webkit" falla, igual vemos el
      # resultado completo de "chromium", "firefox" y "ui-chromium".
      fail-fast: false
      matrix:
        # Estos nombres deben coincidir EXACTO con los "name" de los
        # proyectos en playwright.config.ts. No incluye "api" (tiene su
        # propio job arriba) ni "setup" (no es un proyecto de pruebas en
        # sí: es el que hace login y guarda la sesión, y Playwright lo
        # corre solo automáticamente cuando ve que el proyecto "chromium"
        # lo declara como "dependencies: ['setup']").
        project: [chromium, ui-chromium, firefox, webkit]

    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      HEADLESS: 'true'

    # Mismos pasos que en el job "api" (ver comentarios ahí arriba) más
    # uno extra: acá sí hace falta instalar los navegadores.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Descarga los navegadores que Playwright necesita controlar
      # (Chromium, Firefox, WebKit). No vienen instalados por defecto en
      # la máquina virtual. Este paso solo existe en "ui": "api" no abre
      # navegador, así que ahorrarnos esta descarga achica su duración —
      # importante porque ahora "api" es un gate secuencial delante de
      # todo lo demás.
      - name: Install Playwright Browsers
        # "--with-deps" además instala, a nivel de sistema operativo
        # Linux, las librerías que esos navegadores necesitan para poder
        # arrancar (sin esto, el navegador se instala pero no abre).
        run: pnpm exec playwright install --with-deps

      # "--project=${{ matrix.project }}" le dice a Playwright que corra
      # SOLO el proyecto correspondiente a esta repetición de la matrix.
      # Como "chromium" depende de "setup" en playwright.config.ts,
      # Playwright ejecuta ese login automáticamente antes, aunque
      # nosotros no lo pidamos explícitamente en este comando.
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          # El nombre incluye el proyecto porque las 4 repeticiones de la
          # matrix corren en paralelo: si todas subieran un artifact
          # llamado igual, GitHub Actions rechazaría las que llegaran
          # después por nombre duplicado.
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
